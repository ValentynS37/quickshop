services:
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      BADS_API_KEY: ${BADS_API_KEY:-change-me-before-production}
      DATABASE_URL: postgresql+psycopg://bads:bads@db:5432/bads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      CORS_ORIGINS: http://localhost:8000,http://localhost:5500
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bads
      POSTGRES_USER: bads
      POSTGRES_PASSWORD: bads
    volumes:
      - bads_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bads -d bads"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  bads_postgres:
